# Production-style stack: MongoDB + API + Nginx-served frontend.
#   cp backend/.env.example backend/.env   (fill in secrets)
#   docker compose up -d --build
# App: http://localhost:8080
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      NODE_ENV: production
      # Database name kept from before the Queuer rename so existing installs keep their data.
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/zoopdesk}
      PORT: 5000
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads:
