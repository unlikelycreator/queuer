# Serves the SPA and proxies /api + /uploads to the backend container.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 80m;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location /api/ {
    proxy_pass http://backend:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /uploads/ {
    proxy_pass http://backend:5000;
  }

  # Hashed build assets can be cached forever.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Client-side routing fallback. index.html itself is never cached so new deploys
  # are picked up immediately. The portal / public form pages may be iframed by
  # client websites, everything else may not.
  location ~ ^/(portal|public)/ {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }

  location / {
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
